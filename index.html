<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>EPDS Опрос</title>
</head>
<body>
    <h1>Форма Эдинбургской шкалы послеродовой депрессии</h1>
    <form id="epdsForm">
        <label>Имя:</label><br>
        <input type="text" name="name" required><br><br>
        <label>Email:</label><br>
        <input type="email" name="email" required><br><br>

        <label>1. Я могла смеяться и видеть смешное в вещах</label><br>
        <input type="radio" name="q1" value="0" required> Как обычно<br>
        <input type="radio" name="q1" value="1"> Меньше<br>
        <input type="radio" name="q1" value="2"> Намного меньше<br>
        <input type="radio" name="q1" value="3"> Совсем не могла<br><br>

        <!-- Добавь остальные 9 вопросов по аналогии -->

        <button type="button" onclick="submitForm()">Отправить</button>
    </form>

    <script>
        function submitForm() {
            const form = document.getElementById('epdsForm');
            const formData = new FormData(form);
            const data = {};

            formData.forEach((value, key) => {
                data[key] = value;
            });

            fetch('http://localhost:5000/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result => {
                alert(result.message);
            })
            .catch(error => {
                alert('Ошибка: ' + error);
            });
        }
    </script>
</body>
</html>
